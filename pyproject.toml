[project]
name = "multifidelity"
version = "0.1.0"
description = "Equipment and liquid-water properties with shared variables and selectable formulations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ahuora-builder>=0.1.9",
    "ahuora-compounds>=0.0.31",
    "idaes-pse==2.8.0",
    "pyomo==6.9.2",
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multifidelity = ["property_models/data/*.json", "property_models/data/*.nl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
