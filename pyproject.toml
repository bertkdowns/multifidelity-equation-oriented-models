[project]
name = "multifidelity"
version = "0.1.0"
description = "JSON model language for multifidelity process models"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ahuora-builder>=0.1.9",
    "ahuora-compounds>=0.0.31",
    "idaes-pse==2.8.0",
    "pyomo==6.9.2",
    "pytest>=8,<10",
    "pydantic>=2.12,<3",
    "pint>=0.24,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
multifidelity = ["model_language/models/*.json", "model_language/*.md", "model_language/standard/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
