[project]
name = "multifidelity"
version = "0.1.0"
description = "A heat exchanger with shared public variables and selectable formulations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "idaes-pse==2.8.0",
    "pyomo==6.9.2",
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
