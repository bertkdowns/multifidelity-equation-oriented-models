<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Block explorer — Feeds</title><style>text{font-family:system-ui,sans-serif;fill:#26354b;font-size:12px}.muted{fill:#708097}.small{font-size:10px}.label{font-size:11px;font-weight:700}.heading{font-size:20px;font-weight:700}.bold{font-weight:700}.link{fill:#345f8b}.green{fill:#398575}</style><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="none"/><rect x="0" y="0" width="305" height="900" rx="0" fill="#fff" stroke="#e1e6ed"/><text x="22" y="39" class="green">◈</text><text x="46" y="38" class="label green">M U L T I F I D E L I T Y</text><text x="22" y="68" class="heading">Block explorer</text><rect x="22" y="88" width="261" height="76" rx="6" fill="#f5f8fc" stroke="#b6c7db"/><rect x="32" y="99" width="119" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="44" y="120" class="link">Open workspace</text><rect x="157" y="99" width="116" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="169" y="120" class="link">Save workspace</text><text x="32" y="150" class="small muted">Model, resources and results.</text><text x="22" y="199" class="label">Block registry</text><rect x="22" y="210" width="261" height="38" rx="6" fill="#fafbfd" stroke="#dbe4ee"/><text x="33" y="234" class="">valve</text><text x="263" y="234" class="">⌄</text><rect x="22" y="264" width="261" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="34" y="285" class="link">Choose resources</text><text x="22" y="316" class="small muted">valve_resources.json · 8 records</text><text x="22" y="344" class="muted">Records in other formulations appear when</text><text x="22" y="363" class="muted">you explore those blocks. No values are</text><text x="22" y="382" class="muted">propagated along connections.</text><rect x="22" y="400" width="261" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="34" y="421" class="link">Choose model</text><text x="22" y="468" class="label">Preview formulation</text><rect x="22" y="479" width="261" height="38" rx="6" fill="#fafbfd" stroke="#dbe4ee"/><text x="33" y="503" class="bold">isenthalpic (model)</text><text x="263" y="503" class="">⌄</text><text x="22" y="553" class="muted">Isenthalpic valve with a prescribed</text><text x="22" y="572" class="muted">pressure drop.</text><circle cx="27" cy="624" r="4" fill="#438779"/><text x="40" y="628" class="">Input struct</text><circle cx="27" cy="654" r="4" fill="#628bd4"/><text x="40" y="658" class="">Model</text><circle cx="27" cy="684" r="4" fill="#9b76b5"/><text x="40" y="688" class="">Constraint</text><circle cx="27" cy="714" r="4" fill="#b18b54"/><text x="40" y="718" class="">Output struct</text><text x="22" y="816" class="small muted">Read-only · JSON definitions</text><text x="22" y="835" class="small muted">Proposed connection details shown at right.</text><rect x="305" y="0" width="1295" height="55" rx="0" fill="#fff" stroke="#e1e6ed"/><rect x="331" y="10" width="86" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="343" y="31" class="link">Blocks</text><rect x="423" y="10" width="139" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="435" y="31" class="link">Model</text><rect x="568" y="10" width="112" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="580" y="31" class="link">Resource</text><rect x="686" y="10" width="82" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="698" y="31" class="link">Results</text><rect x="774" y="10" width="99" height="34" rx="6" fill="#e5eef9" stroke="#c6d5e5"/><text x="786" y="31" class="link bold">Feeds</text><rect x="879" y="10" width="148" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="891" y="31" class="link">Output channels</text><rect x="305" y="55" width="1295" height="58" rx="0" fill="#fff" stroke="#e1e6ed"/><text x="336" y="90" class="bold">valve</text><text x="333" y="151" class="heading">Feeds · valve</text><text x="333" y="177" class="muted">Manage configured feed instances and their plugin settings.</text><rect x="1400" y="132" width="172" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="1412" y="153" class="link">Download document JSON</text><rect x="333" y="200" width="1239" height="73" rx="6" fill="#f5f9fd" stroke="#b6c7db"/><text x="347" y="224" class="bold">Feed document</text><text x="347" y="246" class="muted">Plugins are registered in Python. This document selects plugins and configures their instances.</text><text x="333" y="307" class="bold">Configured feeds</text><rect x="333" y="322" width="1239" height="102" rx="6" fill="#fff" stroke="#dbe4ee"/><rect x="333" y="322" width="1239" height="34" rx="0" fill="#edf3fa" stroke="#dbe4ee"/><text x="343" y="344" class="label">Instance</text><text x="580" y="344" class="label">Plugin type</text><rect x="334" y="356" width="1237" height="34" rx="0" fill="#eaf1fa" stroke="#e3e9f1"/><text x="343" y="378" class="link bold">plant</text><text x="580" y="378" class="">plant_api</text><rect x="334" y="390" width="1237" height="34" rx="0" fill="#fff" stroke="#e3e9f1"/><text x="343" y="412" class="link bold">equipment</text><text x="580" y="412" class="">csv</text><text x="333" y="463" class="bold">plant · Plugin configuration</text><text x="333" y="496" class="muted">provider_type selects the registered plant_api plugin.</text><text x="333" y="530" class="muted">FeedRegistry describes available plugins and typed config schemas.</text><text x="333" y="564" class="muted">FeedDocument describes which configured instances this workspace uses.</text><text x="333" y="598" class="muted">FeedCollection owns runtime instances and routes bulk value reads.</text><text x="333" y="632" class="muted">Tags are discovered in Python; they are not stored in this document.</text><rect x="1282" y="447" width="290" height="359" rx="6" fill="#fff" stroke="#dbe4ee"/><text x="1298" y="475" class="bold">Feed configuration</text><text x="1298" y="509" class="label">Configuration (JSON)</text><text x="1298" y="539" class="small">{ &quot;columns&quot;: {</text><text x="1298" y="560" class="small">&quot;pressure_measurement&quot;: &quot;PT101&quot;</text><text x="1298" y="581" class="small">} }</text><rect x="1298" y="753" width="132" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="1310" y="774" class="link">Save configuration</text><text x="333" y="700" class="bold">Configuration (JSON)</text><text x="333" y="725" class="muted">{ &quot;columns&quot;: { &quot;inlet_flow&quot;: &quot;FT101&quot;, &quot;pressure_measurement&quot;: &quot;PT101&quot; } }</text><text x="333" y="750" class="muted">get_tags() discovers tags; read(tags) supplies their values.</text><text x="333" y="853" class="muted">Configuration edits are saved with the workspace. Connector code and credentials remain in Python.</text></svg>