<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Model explorer — Providers</title><style>text{font-family:system-ui,sans-serif;fill:#26354b;font-size:12px}.muted{fill:#708097}.small{font-size:10px}.label{font-size:11px;font-weight:700}.heading{font-size:20px;font-weight:700}.bold{font-weight:700}.link{fill:#345f8b}.green{fill:#398575}</style><rect x="0" y="0" width="1600" height="900" rx="0" fill="#f7f9fc" stroke="none"/><rect x="0" y="0" width="305" height="900" rx="0" fill="#fff" stroke="#e1e6ed"/><text x="22" y="39" class="green">◈</text><text x="46" y="38" class="label green">M U L T I F I D E L I T Y</text><text x="22" y="68" class="heading">Model explorer</text><rect x="22" y="88" width="261" height="76" rx="6" fill="#f5f8fc" stroke="#b6c7db"/><rect x="32" y="99" width="119" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="44" y="120" class="link">Open workspace</text><rect x="157" y="99" width="116" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="169" y="120" class="link">Save workspace</text><text x="32" y="150" class="small muted">Implementation, information and results.</text><text x="22" y="199" class="label">Model library</text><rect x="22" y="210" width="261" height="38" rx="6" fill="#fafbfd" stroke="#dbe4ee"/><text x="33" y="234" class="">valve</text><text x="263" y="234" class="">⌄</text><rect x="22" y="264" width="261" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="34" y="285" class="link">Choose information</text><text x="22" y="316" class="small muted">valve_information.json · 8 records</text><text x="22" y="344" class="muted">Records in other relationships appear when</text><text x="22" y="363" class="muted">you explore those models. No values are</text><text x="22" y="382" class="muted">propagated along connections.</text><rect x="22" y="400" width="261" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="34" y="421" class="link">Choose implementation</text><text x="22" y="468" class="label">Preview relationship</text><rect x="22" y="479" width="261" height="38" rx="6" fill="#fafbfd" stroke="#dbe4ee"/><text x="33" y="503" class="bold">isenthalpic (implementation)</text><text x="263" y="503" class="">⌄</text><text x="22" y="553" class="muted">Isenthalpic valve with a prescribed</text><text x="22" y="572" class="muted">pressure drop.</text><circle cx="27" cy="624" r="4" fill="#438779"/><text x="40" y="628" class="">Input struct</text><circle cx="27" cy="654" r="4" fill="#628bd4"/><text x="40" y="658" class="">Model</text><circle cx="27" cy="684" r="4" fill="#9b76b5"/><text x="40" y="688" class="">Constraint</text><circle cx="27" cy="714" r="4" fill="#b18b54"/><text x="40" y="718" class="">Output struct</text><text x="22" y="816" class="small muted">Read-only · JSON definitions</text><text x="22" y="835" class="small muted">Proposed connection details shown at right.</text><rect x="305" y="0" width="1295" height="55" rx="0" fill="#fff" stroke="#e1e6ed"/><rect x="331" y="10" width="86" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="343" y="31" class="link">Diagram</text><rect x="423" y="10" width="139" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="435" y="31" class="link">Implementation</text><rect x="568" y="10" width="112" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="580" y="31" class="link">Information</text><rect x="686" y="10" width="82" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="698" y="31" class="link">Results</text><rect x="774" y="10" width="99" height="34" rx="6" fill="#e5eef9" stroke="#c6d5e5"/><text x="786" y="31" class="link bold">Providers</text><rect x="879" y="10" width="148" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="891" y="31" class="link">Output channels</text><rect x="305" y="55" width="1295" height="58" rx="0" fill="#fff" stroke="#e1e6ed"/><text x="336" y="90" class="bold">valve</text><text x="333" y="151" class="heading">Providers · valve</text><text x="333" y="177" class="muted">Manage registered data sources and their supplied information records.</text><rect x="1400" y="132" width="172" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="1412" y="153" class="link">Download catalogue JSON</text><rect x="333" y="200" width="1239" height="73" rx="6" fill="#f5f9fd" stroke="#b6c7db"/><text x="347" y="224" class="bold">Python registrations</text><text x="347" y="246" class="muted">Connectors are registered in Python. Select one below to edit its record list or subscriptions.</text><text x="333" y="307" class="bold">Registered providers</text><rect x="333" y="322" width="1239" height="102" rx="6" fill="#fff" stroke="#dbe4ee"/><rect x="333" y="322" width="1239" height="34" rx="0" fill="#edf3fa" stroke="#dbe4ee"/><text x="343" y="344" class="label">Provider</text><text x="580" y="344" class="label">Implementation</text><text x="905" y="344" class="label">Record IDs</text><text x="1280" y="344" class="label">Records</text><rect x="334" y="356" width="1237" height="34" rx="0" fill="#eaf1fa" stroke="#e3e9f1"/><text x="343" y="378" class="link bold">plant</text><text x="580" y="378" class="">PlantAPI</text><text x="905" y="378" class="">2 information records</text><text x="1280" y="378" class="">2</text><rect x="334" y="390" width="1237" height="34" rx="0" fill="#fff" stroke="#e3e9f1"/><text x="343" y="412" class="link bold">equipment</text><text x="580" y="412" class="">EquipmentCSV</text><text x="905" y="412" class="">valve_pressure_drop</text><text x="1280" y="412" class="">1</text><text x="333" y="463" class="bold">plant · Supplied records</text><text x="333" y="486" class="muted">The provider returns values keyed by these information record IDs.</text><rect x="333" y="503" width="925" height="156" rx="6" fill="#fff" stroke="#dbe4ee"/><rect x="333" y="503" width="925" height="35" rx="0" fill="#edf3fa" stroke="#dbe4ee"/><text x="343" y="526" class="label">Record ID</text><text x="590" y="526" class="label">Information type</text><text x="805" y="526" class="label">Variable path</text><text x="1090" y="526" class="label">Action</text><text x="343" y="567" class="">inlet_flow</text><text x="590" y="567" class="">sensor_reading</text><text x="805" y="567" class="">inlet.flow</text><text x="1090" y="567" class="link">Remove</text><text x="343" y="621" class="">pressure_measurement</text><text x="590" y="621" class="">sensor_reading</text><text x="805" y="621" class="">inlet.pressure</text><text x="1090" y="621" class="link">Remove</text><rect x="1282" y="447" width="290" height="359" rx="6" fill="#fff" stroke="#dbe4ee"/><text x="1298" y="475" class="bold">Add supplied record</text><text x="1298" y="509" class="label">Record ID</text><rect x="1298" y="521" width="258" height="35" rx="6" fill="#fff" stroke="#dbe4ee"/><text x="1309" y="544" class="">pressure_measurement</text><rect x="1298" y="753" width="132" height="34" rx="6" fill="#fff" stroke="#c6d5e5"/><text x="1310" y="774" class="link">Add record</text><text x="333" y="700" class="bold">Provider details</text><text x="333" y="725" class="muted">plant · PlantAPI · 2 supplied information records</text><text x="333" y="750" class="muted">No data fetched. The simulation requests these record IDs when solve() runs.</text><text x="333" y="853" class="muted">Catalogue edits are saved with the workspace. Connector code and credentials remain in Python.</text></svg>