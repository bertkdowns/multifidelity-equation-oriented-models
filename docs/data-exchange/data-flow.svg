<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 145 1400 1400" role="img" aria-labelledby="title desc">
<title id="title">Model and data flow</title>
<desc id="desc">The main workflow runs down the centre: external data sources, FeedCollection, fresh ResourceDocument, ParameterDocument, numerical instance, solve, and ResultsDocument. FeedRegistry and BlockRegistry supply platform capabilities from the left. FeedDocument, an existing ResourceDocument, and ModelDocument supply user configuration from the right. Selection and application appear as arrows; secondary validation dependencies are omitted. WorkspaceDocument bundles the saved artifacts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#62758b"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#23364a}.title{font-size:28px;font-weight:700}.column{font-size:13px;font-weight:700;letter-spacing:1px;fill:#526982;text-anchor:middle}.name{font-size:19px;font-weight:650;text-anchor:middle}.detail{font-size:14px;fill:#526982;text-anchor:middle}.label{font-size:14px;fill:#526982;paint-order:stroke;stroke:#f7f9fc;stroke-width:7;stroke-linejoin:round}.edge{fill:none;stroke:#62758b;stroke-width:2;marker-end:url(#arrow)}.artifact{fill:#edf3fc;stroke:#8ca8cc}.runtime{fill:#eaf5f0;stroke:#79aa97}.operation{fill:#fff;stroke:#9caebe}.platform{fill:#f0edf8;stroke:#a196bd}.box{stroke-width:1.5;rx:10}</style>
<rect width="1400" height="1580" fill="#f7f9fc"/>

<rect x="520" y="170" width="360" height="88" class="box operation"/>
<text x="700.0" y="204" class="name">External data sources</text>
<text x="700.0" y="230" class="detail">CSV, API, SQL, …</text>
<rect x="520" y="340" width="360" height="88" class="box runtime"/>
<text x="700.0" y="374" class="name">FeedCollection</text>
<text x="700.0" y="400" class="detail">Configured runtime feed instances</text>
<rect x="520" y="525" width="360" height="88" class="box artifact"/>
<text x="700.0" y="559" class="name">Fresh ResourceDocument</text>
<text x="700.0" y="585" class="detail">New values; metadata retained</text>
<rect x="520" y="710" width="360" height="88" class="box artifact"/>
<text x="700.0" y="744" class="name">ParameterDocument</text>
<text x="700.0" y="770" class="detail">Selected tags, replacements, initials</text>
<rect x="520" y="895" width="360" height="88" class="box runtime"/>
<text x="700.0" y="929" class="name">Numerical instance</text>
<text x="700.0" y="955" class="detail">Live model with selected values applied</text>
<rect x="520" y="1080" width="360" height="88" class="box operation"/>
<text x="700.0" y="1114" class="name">Solve</text>
<text x="700.0" y="1140" class="detail">Updates the numerical instance</text>
<rect x="520" y="1265" width="360" height="88" class="box artifact"/>
<text x="700.0" y="1299" class="name">ResultsDocument</text>
<text x="700.0" y="1325" class="detail">Numerical snapshot + explicit solve status</text>
<path d="M700 258 V340" class="edge"/>
<text x="723" y="305" class="label">via configured feeds</text>
<path d="M700 428 V525" class="edge"/>
<text x="723" y="484" class="label">read(resources)</text>
<path d="M700 613 V710" class="edge"/>
<text x="723" y="669" class="label">select_parameters</text>
<path d="M700 798 V895" class="edge"/>
<text x="723" y="854" class="label">apply_parameters</text>
<path d="M700 983 V1080" class="edge"/>
<path d="M700 1168 V1265" class="edge"/>
<text x="723" y="1224" class="label">export_results</text>
<rect x="40" y="340" width="340" height="88" class="box platform"/>
<text x="210.0" y="374" class="name">FeedRegistry</text>
<text x="210.0" y="400" class="detail">Available plugins + config schemas</text>
<rect x="1020" y="340" width="340" height="88" class="box artifact"/>
<text x="1190.0" y="374" class="name">FeedDocument</text>
<text x="1190.0" y="400" class="detail">Instance names, plugin types, config</text>
<path d="M380 384 H520" class="edge"/>
<text x="391" y="368" class="label">available plugins</text>
<path d="M1020 384 H880" class="edge"/>
<text x="886" y="368" class="label">configure instances</text>
<rect x="1020" y="525" width="340" height="88" class="box artifact"/>
<text x="1190.0" y="559" class="name">Existing ResourceDocument</text>
<text x="1190.0" y="585" class="detail">Metadata, saved and static values</text>
<path d="M1020 569 H880" class="edge"/>
<text x="897" y="553" class="label">refresh values</text>
<rect x="40" y="895" width="340" height="88" class="box platform"/>
<text x="210.0" y="929" class="name">BlockRegistry</text>
<text x="210.0" y="955" class="detail">Block definitions + symbolic builders</text>
<rect x="1020" y="895" width="340" height="88" class="box artifact"/>
