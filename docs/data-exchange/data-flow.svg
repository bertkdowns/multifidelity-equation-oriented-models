<text x="393" y="923" class="label">available blocks</text>
<path d="M1020 939 H880" class="edge"/>
<text x="907" y="923" class="label">model choices</text>
<rect x="40" y="1430" width="1320" height="90" rx="10" fill="#fff" stroke="#b8c6d5" stroke-dasharray="7 5"/>
<text x="700" y="1465" class="name">WorkspaceDocument bundles saved artifacts</text>
<text x="700" y="1494" class="detail">ModelDocument + ResourceDocument + ResultsDocument + optional FeedDocument</text>
</svg>
