<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 110 1000 910" role="img" aria-labelledby="title desc">
<title id="title">From external data to model results</title>
<desc id="desc">A vertical workflow: external data sources supply values via feeds to a ResourceDocument. Selected resource values are applied as parameters to a numerical instance. Solving and exporting produces a ResultsDocument. A dashed future publishing path leads to external systems.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#74879b"/></marker>
</defs>
<style>
  text{font-family:system-ui,sans-serif;fill:#26354b}
  .title{font-size:29px;font-weight:700}
  .subtitle{font-size:15px;fill:#708097}
  .name{font-size:21px;font-weight:650;text-anchor:middle}
  .detail{font-size:15px;fill:#62758b;text-anchor:middle}
  .label{font-size:16px;font-weight:600;fill:#526982}
  .note{font-size:14px;fill:#708097}
  .box{stroke-width:1.5;rx:12}
  .document{fill:#edf3fc;stroke:#9eb6d4}
  .runtime{fill:#eaf5f0;stroke:#89b3a2}
  .external{fill:#fff;stroke:#c2cdd9}
  .edge{fill:none;stroke:#74879b;stroke-width:2;marker-end:url(#arrow)}
  .future{stroke-dasharray:7 6}
</style>
<rect width="1000" height="1080" fill="#f7f9fc"/>

<rect x="325" y="135" width="350" height="90" class="box external"/>
<text x="500" y="174" class="name">External data sources</text>
<text x="500" y="201" class="detail">CSV files, APIs and databases</text>

<path d="M500 225 V315" class="edge"/>
<text x="530" y="264" class="label">Via feeds</text>
<text x="530" y="288" class="note">Refresh existing resource values</text>

<rect x="325" y="315" width="350" height="90" class="box document"/>
<text x="500" y="354" class="name">ResourceDocument</text>
<text x="500" y="381" class="detail">Available evidence and metadata</text>

<path d="M500 405 V495" class="edge"/>
<text x="530" y="444" class="label">Select and apply parameters</text>
<text x="530" y="468" class="note">Choose evidence, then apply its values</text>

<rect x="325" y="495" width="350" height="90" class="box runtime"/>
<text x="500" y="534" class="name">Numerical instance</text>
<text x="500" y="561" class="detail">Live model equations</text>

<path d="M500 585 V675" class="edge"/>
<text x="530" y="624" class="label">Solve, then export</text>
<text x="530" y="648" class="note">Record a snapshot and explicit status</text>

<rect x="325" y="675" width="350" height="90" class="box document"/>
<text x="500" y="714" class="name">ResultsDocument</text>
<text x="500" y="741" class="detail">Numerical values and solve status</text>

<rect x="50" y="850" width="900" height="155" rx="14" fill="#f1f4f8" stroke="#c2cdd9" stroke-dasharray="7 6"/>
<text x="75" y="883" class="label">Future work</text>
<path d="M500 765 V895" class="edge future"/>
<text x="530" y="814" class="label">Via publisher</text>
<text x="530" y="838" class="note">Deliver results to a destination</text>

<rect x="325" y="895" width="350" height="80" class="box external future"/>
<text x="500" y="929" class="name">External systems</text>
<text x="500" y="954" class="detail">Storage, reporting and integrations</text>

</svg>
